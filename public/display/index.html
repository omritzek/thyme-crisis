<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thyme Crisis — Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/shared/theme.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  canvas {
    background: #111;
    max-width: 100%;
    max-height: 100%;
  }
  #pairing {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--tc-text);
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    text-align: center;
    gap: 18px;
  }
  #gameTitle {
    font-size: 56px;
  }
  #tagline {
    margin-top: -6px;
    margin-bottom: 8px;
  }
  #pairingPanel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 36px 48px;
    border-radius: 4px;
  }
  #pairingLabel {
    margin: 0;
  }
  #pairingUrl {
    color: var(--tc-olive-light);
    font-size: 16px;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
  }
  #sessionCode {
    font-family: var(--tc-font);
    font-size: 68px;
    letter-spacing: 14px;
    font-weight: 900;
    color: var(--tc-cream);
    text-shadow: 0 0 16px rgba(255, 140, 26, 0.35), 0 2px 0 #000;
  }
  #qrFrame {
    padding: 14px;
    background: #fff;
    border-radius: 2px;
  }
  #qrImg {
    display: block;
    width: 220px;
    height: 220px;
  }
  #pairingHint {
    color: var(--tc-text-dim);
    font-size: 14px;
    max-width: 420px;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
  }
  #pauseOverlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.6);
  }
  #pausePanel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 36px 48px;
    border-radius: 4px;
  }
  #pauseTitle {
    font-size: 40px;
    margin: 0;
  }
  #pauseButtons {
    display: flex;
    gap: 16px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="pairing" class="tc-backdrop">
    <h1 id="gameTitle" class="tc-title">Thyme Crisis<span class="tc-title-sub">Light Gun Ops</span></h1>
    <div id="tagline" class="tc-tagline">One Herb. One Mission. No Mercy.</div>
    <div id="pairingPanel" class="tc-panel">
      <h2 id="pairingLabel" class="tc-label">Point your phone's browser at</h2>
      <div id="pairingUrl"></div>
      <div id="sessionCode">----</div>
      <div id="qrFrame"><img id="qrImg" alt="QR code to join"></div>
    </div>
    <div id="pairingHint">Scan the QR code with your phone, or open the URL above and enter the code shown.</div>
  </div>
  <div id="stage" class="hidden">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="pauseOverlay" class="hidden">
      <div id="pausePanel" class="tc-panel">
        <h2 id="pauseTitle" class="tc-title">Paused</h2>
        <div id="pauseButtons">
          <button id="pauseRestartBtn" class="tc-btn tc-btn-accent">Restart</button>
          <button id="pauseQuitBtn" class="tc-btn">Quit to Lobby</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/shared/protocol.js"></script>
  <script src="/display/display.js"></script>
</body>
</html>
