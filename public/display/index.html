<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Light Gun — Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #111;
    max-width: 100%;
    max-height: 100%;
  }
  #pairing {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    text-align: center;
    gap: 16px;
  }
  #pairing h1 {
    font-weight: 400;
    font-size: 22px;
    margin: 0 0 8px 0;
    color: #aaa;
  }
  #sessionCode {
    font-size: 72px;
    letter-spacing: 12px;
    font-weight: 700;
    color: #fff;
  }
  #qrImg {
    width: 240px;
    height: 240px;
    background: #fff;
    border-radius: 8px;
    padding: 12px;
  }
  #pairingHint {
    color: #888;
    font-size: 15px;
    max-width: 420px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="pairing">
    <h1>Point your phone's browser at:</h1>
    <div id="pairingUrl" style="color:#6cf;font-size:18px;"></div>
    <div id="sessionCode">----</div>
    <img id="qrImg" alt="QR code to join">
    <div id="pairingHint">Scan the QR code with your phone, or open the URL above and enter the code shown.</div>
  </div>
  <div id="stage" class="hidden">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>

  <script src="/shared/protocol.js"></script>
  <script src="/display/display.js"></script>
</body>
</html>
